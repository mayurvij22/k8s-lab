apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
      - name: payments
        image: busybox:1.37
        command: ["sh", "-c"]
        args:
          - |
            echo "payments-service starting (SLOW MODE)..."
            mkdir -p /www
            echo "payment OK (after delay)" > /www/index.html
            touch /tmp/ready
            echo "Listening on port 8080 with 30s response delay..."
            while true; do
              echo -e "HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\npayment OK" | nc -l -p 8080 -w 30 > /dev/null 2>&1
              sleep 30
            done
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests: { memory: "16Mi", cpu: "10m" }
          limits:   { memory: "64Mi" }
