apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: orders
        image: busybox:1.37
        command: ["sh", "-c"]
        args:
          - |
            echo "orders-service v5 starting..."
            if [ -z "$DB_HOST" ]; then
              echo "FATAL: environment variable DB_HOST is not set"
              exit 1
            fi
            echo "Connected to database at $DB_HOST"
            echo "Loading product catalog into memory..."
            for mb in 10 20 30 40 50 70 90 120; do
              echo "  loading catalog chunk: ${mb}MB"
              dd if=/dev/zero of=/dev/null bs=${mb}M count=1 2>/dev/null
              sleep 2
            done
            echo "Catalog loaded"
            touch /tmp/ready
            while true; do sleep 30; done
        env:
        - name: DB_HOST
          value: "postgres.db.svc.cluster.local"
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests: { memory: "16Gi", cpu: "10m" }
          limits:   { memory: "64Gi" }
