apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: orders
        image: busybox:1.37
        command: ["sh", "-c"]
        args:
          - |
            echo "orders-service v9 starting..."
            if [ -z "$DB_HOST" ]; then
              echo "FATAL: environment variable DB_HOST is not set"
              exit 1
            fi
            echo "Connected to database at $DB_HOST"
            echo "Loading slow config (takes ~20 seconds)..."
            sleep 20
            echo "Config loaded, service ready"
            touch /tmp/ready
            touch /tmp/alive
            while true; do sleep 30; done
        env:
        - name: DB_HOST
          value: "postgres.db.svc.cluster.local"
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["test", "-f", "/tmp/alive"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2
        resources:
          requests: { memory: "16Mi", cpu: "10m" }
          limits:   { memory: "64Mi" }
        startupProbe:
          exec: 
            command: ["test", "-f", "/tmp/alive"]
        periodSeconds: 5
        failureThreshold: 12
          
