apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: orders
        image: busybox:1.37
        command: ["sh", "-c"]
        args:
          - |
            echo "orders-service v11 starting..."
            echo "Connecting to payments service..."
            if ! nslookup payments.payments.svc.cluster.local > /dev/null 2>&1; then
              echo "FATAL: cannot resolve payments service"
              echo "DNS lookup failed for: payments.payments.svc.cluster.local"
              exit 1
            fi
            echo "Payments service found"
            mkdir -p /www
            echo "OK" > /www/index.html
            touch /tmp/ready
            httpd -f -p 8080 -h /www
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests: { memory: "16Mi", cpu: "10m" }
          limits:   { memory: "64Mi" }
