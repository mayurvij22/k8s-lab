apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: orders
        image: busybox:1.37
        command: ["sh", "-c"]
        args:
          - |
            echo "orders-service v12 starting..."
            mkdir -p /www
            cat > /www/index.html << 'SCRIPT'
            orders: checking payments...
            SCRIPT
            touch /tmp/ready
            echo "Service ready, testing payments connectivity..."
            RESULT=$(wget -qO- --timeout=3 http://payments.orders.svc.cluster.local 2>&1) || true
            echo "Payments response: $RESULT"
            httpd -f -p 8080 -h /www
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests: { memory: "16Mi", cpu: "10m" }
          limits:   { memory: "64Mi" }